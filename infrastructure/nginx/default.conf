# Nginx balances gateway processes only. Application policies remain in Node.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream gateways {
    zone gateways 64k;
    server gateway-1:3000 resolve max_fails=1 fail_timeout=5s;
    server gateway-2:3000 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 16k;

    location = /entry-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"entry"}';
    }

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Overwrite client-supplied forwarding headers at this trust boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        # No retries of HTTP errors or non-idempotent requests already sent.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        # Local demo evidence: which gateway handled this request.
        add_header X-Gateway-Upstream $upstream_addr always;
    }
}
